<!DOCTYPE html>
<html>
{{> head}}
<body>
    {{> header}}
	<p class="section-label">{{tag}}</p>
	
	<div class="entries entries-tagged">
	      {{#entries}}
		<article class="entry-row-wrap"><a href="{{{url}}}" class="row">
	          <span class="row-main">
	            <span class="row-title">{{title}}</span>
	
	            {{#summary}}
	            <span class="row-summary">{{summary}}</span>
	            {{/summary}}
	          </span>
	
	          {{#date}}<span class="row-date">{{date}}</span>{{/date}}
	        </a></article>
	      {{/entries}}
	</div>

    {{#pagination}}
	
	<nav class="pagination pagination-tagged" aria-label="Pagination">{{#previous}}<a href="/tagged/{{slug}}/page/{{previous}}">&larr;&nbsp;Newer</a>{{/previous}}{{#next}}<a href="/tagged/{{slug}}/page/{{next}}">Older&nbsp;&rarr;</a>{{/next}}</nav>
    {{/pagination}}

    {{> footer}}
</body>
</html>
