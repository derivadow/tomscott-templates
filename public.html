<!DOCTYPE html>
<html lang="en-GB">
{{> head}}
<body>
    {{> skip-link}}
    <style>
      body {
	margin: 2em;
}

td, tr {
	border: none;
}
    </style>
    <main class="public-content" id="main-content" tabindex="-1">
    <h1>{{#breadcrumbs}}
	      <a href="{{path}}">{{name}}</a> /
	      {{/breadcrumbs}}
	      {{dirname}}</h1>
	
	<table>
	      {{#contents}}
		<tr>
			<td><a href="{{path}}">{{name}}</a></td>
		</tr>
	      {{/contents}}
	</table>
    </main>
</body>
</html>
